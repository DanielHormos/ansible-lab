- name: Baseline for lab servers
  hosts: lab
  become: true

  tasks:
    - name: Set admin group depending on OS
      ansible.builtin.set_fact:
        admin_group: "{{ 'wheel' if ansible_os_family == 'RedHat' else 'sudo' }}"

    - name: Install base packages
      ansible.builtin.package:
        name: "{{ base_packages }}"
        state: present

    - name: Create users
      ansible.builtin.user:
        name: "{{ item.name }}"
        groups: "{{ admin_group }}"
        append: true
        shell: /bin/bash
      loop: "{{ lab_users }}"

    - name: Set password for labadmin
      ansible.builtin.user:
        name: labadmin
        password: "{{ vault_labadmin_password | password_hash('sha512') }}"
        update_password: on_create
      no_log: true

    - name: Create app directory with correct permissions
      ansible.builtin.file:
        path: /opt/app
        state: directory
        owner: labadmin
        mode: "0750"

    - name: Deploy login banner
      ansible.builtin.template:
        src: templates/motd.j2
        dest: /etc/motd
        owner: root
        mode: "0644"

    - name: Ensure sshd runtime directory exists
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        mode: "0755"

    - name: Disable root login over SSH
      tags: ssh
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh

    - name: Limit login attempts
      tags: ssh
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?MaxAuthTries'
        line: 'MaxAuthTries 3'
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart ssh

    - name: Make sure SSH is running and starts at boot
      tags: ssh
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: true

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
